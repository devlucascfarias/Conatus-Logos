# Registro de ferramentas do harness (fonte única de verdade — seção 5.2/4 do PLAN.md).
# O dataset de cada fase só pode referenciar ferramentas com "enabled: true" aqui.
# schema_path é relativo a src/schemas/.

version: 1

tools:
  checker:
    enabled: true
    version: "1.0"
    schema_path: "checker.json"
    side_effects: "exec"
    requires_confirmation: false

  read_file:
    enabled: true
    version: "1.0"
    schema_path: "read_file.json"
    side_effects: "read"
    requires_confirmation: false

  write_file:
    enabled: true
    version: "1.0"
    schema_path: "write_file.json"
    side_effects: "write"
    requires_confirmation: false

  list_files:
    enabled: true
    version: "1.0"
    schema_path: "list_files.json"
    side_effects: "read"
    requires_confirmation: false

  shell:
    enabled: true
    version: "2.0"  # binary+args estruturado, sem shell=True (execução OS-independente)
    schema_path: "shell.json"
    side_effects: "exec"
    requires_confirmation: true

  # Fase 2+ — schemas já existem (seção 4.6), mas "enabled: false" nesta geração (D5).
  apply_patch:
    enabled: false
    version: "1.0"
    schema_path: "apply_patch.json"
    side_effects: "write"
    requires_confirmation: false

  search_code:
    enabled: false
    version: "1.0"
    schema_path: "search_code.json"
    side_effects: "read"
    requires_confirmation: false

  git_diff:
    enabled: false
    version: "1.0"
    schema_path: "git_diff.json"
    side_effects: "read"
    requires_confirmation: false

  web_search:
    enabled: true
    version: "1.0"
    schema_path: "web_search.json"
    side_effects: "read"
    requires_confirmation: false
