# Configuração de treino (seções 11 e 12 do PLAN.md).
# Valores são baseline experimental (seção 11.2), não definitivos — ajustar após profiling
# real de VRAM na primeira execução (célula de VRAM do notebook, torch.cuda.max_memory_allocated()).
#
# D-frontend-pivot-model-swap (2026-07-09, docs/PLAN.md): trocado de ibm-granite/granite-4.1-8b
# para Qwen/Qwen3-4B-Instruct-2507 — modelo 4B, sem modo de "thinking" nativo (não briga com a
# gramática <think>/<tool_call>/<final> treinada por cima), base mais leve pro hardware
# disponível (a A2000 12GB penava com o 8B mesmo em sequence_length=1024). Apesar do nome da
# decisão (cunhado durante um pivô de especialização em frontend que foi revertido depois — ver
# docs/PLAN.md), a troca de modelo em si é independente disso e continua valendo.

version: 1

model:
  base_model: "Qwen/Qwen3-4B-Instruct-2507"
  load_in_4bit: true
  bnb_4bit_quant_type: "nf4"
  bnb_4bit_compute_dtype: "bfloat16"
  bnb_4bit_use_double_quant: true

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  # D-qwen3-qknorm-lora: Qwen3 aplica RMSNorm em q/k DEPOIS do reshape da projeção (QK-norm) —
  # colocar adapter LoRA em q_proj/k_proj introduz tensores com shape incompatível nesse
  # caminho de normalização, e isso já foi reportado travando com erro CUBLAS na primeira
  # camada de atenção. Por isso o conjunto de target_modules aqui EXCLUI q_proj/k_proj,
  # diferente do que era usado para o Granite. Ainda assim, confirme via
  # model.named_modules() na primeira carga real (mesmo espírito da seção 17 do PLAN.md) —
  # isso veio de pesquisa, não de execução real neste projeto ainda.
  target_modules:
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"

data:
  train_path: "data/train"
  validation_path: "data/validation"
  sequence_length: 4096
  group_by_length: true    # D8 — sem sequence packing na v1

training:
  batch_size_per_device: 1
  gradient_accumulation_steps: 16
  learning_rate: 2.0e-4
  lr_scheduler_type: "cosine"
  warmup_ratio: 0.03
  num_train_epochs: 3
  # D-maxsteps-v2: max_steps=-1 (sentinela do HF Trainer para "não sobrepor num_train_epochs").
  # ERRO CONFIRMADO NO COLAB: um max_steps positivo SEMPRE sobrepõe num_train_epochs no HF
  # Trainer — com max_steps=3000 fixo aqui antes, e um dataset de ~465 exemplos de treino
  # (batch efetivo 16 -> ~30 passos/época), isso virava ~100 épocas em vez das 3 pretendidas
  # (overfitting severo, e ~12h de treino em vez do esperado). A rede de segurança contra
  # queda de sessão do Colab (seção 11.2) já vem de save_steps/resume_from_checkpoint, não
  # precisa de um max_steps artificialmente alto — por isso -1 é o valor correto aqui, não
  # um número grande "por via das dúvidas".
  max_steps: -1
  optim: "paged_adamw_8bit"
  # D-l4-checkpointing-tradeoff: desligado por decisão explícita do usuário, ACEITANDO RISCO
  # calculado (não medido) de OOM. Cálculo com dados reais de pesquisa (não só extrapolação da
  # T4): checkpointing tipicamente economiza ~20-30% de VRAM total, ponta a ponta (não os
  # 70-80% às vezes citados pra ativações isoladas — essa fatia raramente domina o total).
  # T4 usou 7,6GB com checkpointing=true em sequence_length=2048; sem checkpointing, no mesmo
  # seq_len, estimativa ~7,6 / (1-0,25) ≈ 10GB; escalando pra sequence_length=4096 da L4
  # (dobrar sequence_length tipicamente custa 1,5-2x de VRAM, não linear puro) dá uma faixa de
  # ~15-20GB — a L4 tem 24GB (~22-23GB úteis), então PROVAVELMENTE cabe, mas com margem
  # apertada, não folgada. Se estourar OOM de verdade, volte pra `true` — isso é decidido antes
  # do treino começar (célula de configuração QLoRA do notebook), não durante, então não perde
  # nada além de tempo até o próximo carregamento do modelo.
  gradient_checkpointing: false
  seed: 42

evaluation:
  # Recalibrado em 2026-07-09: data/train cresceu de ~465 para 2455 exemplos (wave 2 — ver
  # docs/plan_dataset_expansion_wave2_identity_multiturn.md) e o valor antigo (eval_steps=15,
  # calibrado pra ~90 passos totais) ficou obsoleto. Com lote efetivo 16
  # (batch_size_per_device x gradient_accumulation_steps) e 2455 exemplos, são ~153
  # passos/época, ~460 passos totais em 3 épocas — checkpoint a cada meia época (~76 passos,
  # mesma regra "ideal" já documentada aqui antes). Se o dataset mudar de tamanho de novo,
  # ajuste proporcionalmente.
  eval_steps: 76
  save_steps: 76
  save_total_limit: 3

paths:
  # Todos os paths abaixo são relativos à raiz do projeto, ou absolutos quando montados via Drive.
  output_dir: "outputs/checkpoints"
  logs_dir: "outputs/logs"
  adapter_dir: "outputs/adapter"
  drive_mount_point: "/content/drive"   # usado só quando run_on_colab=true

runtime:
  run_on_colab: true
  require_gpu_name_contains: "L4"       # célula de verificação da GPU aborta se nvidia-smi não bater com isto
  mixed_precision: "bf16"
