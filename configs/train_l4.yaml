# Configuração de treino (seções 11 e 12 do PLAN.md).
# Valores são baseline experimental (seção 11.2), não definitivos — ajustar após profiling
# real de VRAM na primeira execução (célula de VRAM do notebook, torch.cuda.max_memory_allocated()).
#
# D-frontend-pivot-model-swap (2026-07-09, docs/PLAN.md): trocado de ibm-granite/granite-4.1-8b
# para Qwen/Qwen3-4B-Instruct-2507 — modelo 4B, sem modo de "thinking" nativo (não briga com a
# gramática <think>/<tool_call>/<final> treinada por cima), base mais leve pro hardware
# disponível (a A2000 12GB penava com o 8B mesmo em sequence_length=1024). Apesar do nome da
# decisão (cunhado durante um pivô de especialização em frontend que foi revertido depois — ver
# docs/PLAN.md), a troca de modelo em si é independente disso e continua valendo.
#
# D-phi4mini-experiment-reverted (2026-07-11): cheguei a configurar microsoft/Phi-4-mini-instruct
# como experimento de controle (isolar se os erros de tool_call eram específicos do Qwen3), mas
# o usuário decidiu não seguir com a troca naquele momento. Achados técnicos ficam registrados
# aqui pra não perder o trabalho, caso a troca volte a ser cogitada depois: Phi-4-mini-instruct
# usa a classe de modelagem "Phi3ForCausalLM" (reaproveitada da família Phi-3 pela própria
# Microsoft, não é engano — confirmado via config.json real do Hub), com q/k/v fundidos numa
# única `qkv_proj` e gate/up fundidos em `gate_up_proj` (diferente de Qwen3/Llama, que têm essas
# projeções separadas) — precisaria virar qkv_proj/gate_up_proj nos target_modules. Também
# confirmado que Phi3Attention não tem QK-norm pós-projeção.
#
# D-granite-swap (2026-07-11): trocado de Qwen/Qwen3-4B-Instruct-2507 para
# ibm-granite/granite-4.1-8b (o modelo ORIGINAL deste projeto, antes de D-frontend-pivot-model-
# swap ter trocado pro Qwen3-4B por limitação de hardware da A2000 12GB — restrição que não se
# aplica mais na L4 24GB). Motivo real, não especulativo: 3 treinos reais seguidos no Qwen3-4B
# com o dataset atual mostraram o MESMO padrão de gramática malformada
# (`<tool_call>` sem `name=`, fechado com tag errada) em checkpoints com quantidades de treino
# muito diferentes (76, 304, 462 passos — o de mais treino foi o PIOR dos três, não o melhor,
# incluindo fabricação de `<tool_result>` e degeneração real em texto alucinado/multilíngue) —
# descartando "precisa de mais treino" como explicação e apontando pra uma questão do
# modelo/config, não do tamanho do dataset. Verificado ANTES de configurar (não assumido):
# `config.json` real do Hub confirma não-gated, Apache 2.0, sem thinking nativo, HumanEval
# 85,37%/MBPP 87,30% (números oficiais do card, não estimativa) — comparado com Qwen3-8B (tem
# thinking nativo ativado por padrão, desqualificado) e Qwen2.5-Coder-7B-Instruct (sem
# benchmarks oficiais confirmados na página, e 7,61B não 8B).

version: 1

model:
  base_model: "ibm-granite/granite-4.1-8b"
  load_in_4bit: true
  bnb_4bit_quant_type: "nf4"
  bnb_4bit_compute_dtype: "bfloat16"
  bnb_4bit_use_double_quant: true

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  # D-granite-target-modules: verificado direto no código-fonte real (`modeling_granite.py` da
  # transformers 5.10.2 instalada localmente, arquitetura `GraniteForCausalLM` confirmada via
  # config.json do Hub) ANTES de configurar — diferente do Phi-4-mini e do Qwen3, o Granite usa
  # projeções clássicas SEPARADAS (q_proj/k_proj/v_proj/o_proj/gate_proj/up_proj/down_proj, sem
  # fusão) e `GraniteAttention.forward` NÃO aplica nenhuma normalização pós-projeção em q/k (sem
  # QK-norm) — o problema que motivou excluir q_proj/k_proj no Qwen3 (D-qwen3-qknorm-lora) não
  # se aplica aqui, dá pra incluir a atenção inteira sem risco de incompatibilidade de shape.
  # Mesmo conjunto que já estava na config original deste projeto (nunca chegou a ser testada
  # de verdade — trocado pro Qwen3 antes do primeiro treino real com o Granite), agora
  # confirmado por leitura de código-fonte real, não só por ter sobrevivido de uma config antiga.
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"

data:
  train_path: "data/train"
  validation_path: "data/validation"
  # D-granite-vram-caution: reduzido de 4096 para 2048 como precaução — 8B é aproximadamente o
  # dobro do footprint de VRAM do Qwen3-4B que já rodamos na L4 (que usava 18,8/22,5GB SEM
  # gradient_checkpointing em sequence_length=4096); nunca medido de verdade com o Granite-8B
  # nesta GPU. Ajustar depois do profiling real da primeira execução (célula de VRAM do
  # notebook) — pode caber mais alto, isso é cautela, não medição.
  sequence_length: 2048
  group_by_length: true    # D8 — sem sequence packing na v1

training:
  batch_size_per_device: 1
  gradient_accumulation_steps: 16
  learning_rate: 2.0e-4
  lr_scheduler_type: "cosine"
  warmup_ratio: 0.03
  num_train_epochs: 3
  # D-maxsteps-v2 (histórico, ainda vale como lição): max_steps positivo SEMPRE sobrepõe
  # num_train_epochs no HF Trainer — ERRO CONFIRMADO NO COLAB quando um valor "de segurança"
  # alto (3000) virou ~100 épocas reais e ~12h de treino num dataset pequeno, sem essa intenção.
  # D-maxsteps-cost-cap-reverted: os dois cortes tentados (270, depois 304) foram testados de
  # verdade contra os 8 probes reais e os dois deram o MESMO padrão de falha grave — 7/8 FAIL,
  # loop nunca fecha `<final>` genuíno, `MAX_STEPS_EXCEEDED` até em "quanto é 2+2?" (achado real,
  # transcrição em modo dev confirmou o modelo gerando gramática malformada — `<tool_call>` sem
  # `name=`, fechado com `</think>` errado — e depois espiralando em texto alucinado/degenerado
  # após rejeição por `SEGMENT_SMUGGLING`). Como 304 (quase 4x mais passos que 76) não mostrou
  # melhora nenhuma sobre 76, a comparação certa não era "76 vs 304" — era "304 vs o treino
  # anterior que COMPLETOU as 3 épocas (~462 passos) e tinha esses mesmos 3 probes passando de
  # forma consistente". Ou seja: o dataset novo (D-think-discipline-frente-b, `<think>` em 38,5%
  # a mais dos exemplos) pode precisar do treino completo pra estabilizar essa distribuição
  # nova, não só de mais alguns passos. Voltando pra -1 (sentinela do HF Trainer, D-maxsteps-v2)
  # — os dois cortes já gastaram 2 treinos sem chegar a um resultado usável, então terminar as 3
  # épocas completas agora é a aposta mais segura, mesmo custando mais créditos numa rodada só.
  max_steps: -1
  optim: "paged_adamw_8bit"
  # D-granite-checkpointing-caution: religado pra `true` — o cálculo anterior (D-l4-
  # checkpointing-tradeoff, histórico) era especificamente pro Qwen3-4B, que já tinha VRAM real
  # medida na L4 (18,8/22,5GB sem checkpointing). Granite-4.1-8B nunca rodou nesta GPU — 8B é
  # ~2x o footprint de parâmetros do 4B, e sem nenhuma medição real ainda, manter checkpointing
  # ligado (custa tempo, não corretude) é a escolha mais segura até o primeiro profiling real
  # confirmar se dá pra desligar de novo.
  gradient_checkpointing: true
  seed: 42

evaluation:
  # Recalibrado em 2026-07-09: data/train cresceu de ~465 para 2455 exemplos (wave 2 — ver
  # docs/plan_dataset_expansion_wave2_identity_multiturn.md) e o valor antigo (eval_steps=15,
  # calibrado pra ~90 passos totais) ficou obsoleto. Com lote efetivo 16
  # (batch_size_per_device x gradient_accumulation_steps) e 2455 exemplos, são ~153
  # passos/época, ~460 passos totais em 3 épocas — checkpoint a cada meia época (~76 passos,
  # mesma regra "ideal" já documentada aqui antes). Se o dataset mudar de tamanho de novo,
  # ajuste proporcionalmente.
  eval_steps: 76
  save_steps: 76
  save_total_limit: 3

paths:
  # Todos os paths abaixo são relativos à raiz do projeto, ou absolutos quando montados via Drive.
  output_dir: "outputs/checkpoints"
  logs_dir: "outputs/logs"
  adapter_dir: "outputs/adapter"
  drive_mount_point: "/content/drive"   # usado só quando run_on_colab=true

runtime:
  run_on_colab: true
  require_gpu_name_contains: "L4"       # célula de verificação da GPU aborta se nvidia-smi não bater com isto
  mixed_precision: "bf16"
