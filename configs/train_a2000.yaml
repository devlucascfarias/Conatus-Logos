# Config de treino real pra RTX A2000 12GB.
#
# Histórico de validação real com o Granite-4.1-8B (2026-07-09, antes do pivô de modelo):
# - sequence_length=1536 passou no smoketest isolado (scripts/vram_smoketest.py --longest
#   --num-examples 1: 9.49 GB alocado / 10.79 GB reservado), mas OOM real de verdade dentro do
#   SFTTrainer (trainer.train(), primeiro passo, cross_entropy_loss) quando rodado via VS Code
#   — o VS Code em si fica aberto o treino inteiro nesse fluxo (diferente de rodar via
#   `nohup`, onde dava pra fechar tudo), consumindo VRAM que o smoketest isolado não contava.
# - Reduzido pra 1024 pro Granite-4.1-8B. Perda de sinal pequena (3.3% de data/train truncado),
#   ganho real de margem, mas ainda apertado — foi exatamente essa dor que motivou a troca de
#   modelo base (ver docs/PLAN.md).
#
# D-frontend-pivot-model-swap: base trocada pra Qwen/Qwen3-4B-Instruct-2507 (4B, ~metade do
# tamanho do Granite-4.1-8B em 4-bit) — sequence_length devolvido pra 2048 como ponto de
# partida (era o valor testado ANTES de precisar cair pra 1024 no 8B), mas isso é uma
# expectativa, não medição — RODE scripts/vram_smoketest.py --longest --num-examples 1 de novo
# antes de confiar nisso pra um treino completo. Com um modelo bem menor, é bem provável que
# caiba com folga suficiente pra nem precisar reduzir, mas ainda não foi medido de verdade
# com o Qwen3.
#
# Use com o notebook via a variável de ambiente TRAIN_CONFIG_PATH (ver notebooks/
# train_granite_l4.ipynb, célula 4):
#
#   TRAIN_CONFIG_PATH=configs/train_a2000.yaml jupyter nbconvert --to notebook --execute \
#       --inplace notebooks/train_granite_l4.ipynb

version: 1

model:
  base_model: "Qwen/Qwen3-4B-Instruct-2507"
  load_in_4bit: true
  bnb_4bit_quant_type: "nf4"
  bnb_4bit_compute_dtype: "bfloat16"
  bnb_4bit_use_double_quant: true

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  # D-qwen3-qknorm-lora (ver mesma nota em train_l4.yaml): Qwen3 usa QK-norm, LoRA em
  # q_proj/k_proj é incompatível com esse caminho de normalização (erro CUBLAS reportado).
  # Excluído aqui também. Confirmar via named_modules() na primeira carga real.
  target_modules:
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"

data:
  train_path: "data/train"
  validation_path: "data/validation"
  sequence_length: 2048
  group_by_length: true

training:
  batch_size_per_device: 1
  gradient_accumulation_steps: 16
  learning_rate: 2.0e-4
  lr_scheduler_type: "cosine"
  warmup_ratio: 0.03
  num_train_epochs: 3
  max_steps: -1
  optim: "paged_adamw_8bit"
  gradient_checkpointing: true
  seed: 42

evaluation:
  # data/train tem 2455 exemplos hoje — ~76 passos = meia época com lote efetivo 16
  # (batch_size_per_device x gradient_accumulation_steps). Ver mesma nota em train_l4.yaml.
  eval_steps: 76
  save_steps: 76
  save_total_limit: 3

paths:
  output_dir: "outputs/checkpoints"
  logs_dir: "outputs/logs"
  adapter_dir: "outputs/adapter"
  drive_mount_point: "/content/drive"   # não usado (run_on_colab: false)

runtime:
  run_on_colab: false
  require_gpu_name_contains: "A2000"
  mixed_precision: "bf16"
