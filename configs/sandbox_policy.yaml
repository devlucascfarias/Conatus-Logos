# Política de segurança do sandbox (seção 7 do PLAN.md).
# Consumida por src/security/policy.py — nenhum valor deve ser hardcoded no código.

version: 1

resource_limits:
  default_timeout_ms: 10000
  checker_compile_and_test_timeout_ms: 60000
  max_output_bytes: 65536          # trunca stdout/stderr antes de voltar ao contexto do modelo
  max_memory_bytes: 1073741824     # 1 GiB, aplicado via resource.setrlimit quando disponível (Linux)

filesystem:
  # read_file/write_file/list_files resolvem sempre relativo ao workspace da sessão;
  # qualquer ".." ou caminho absoluto que escape do workspace é rejeitado (FILE_NOT_FOUND).
  workspace_root_env: "PRAXIS_WORKSPACE_ROOT"   # se ausente, usa tempfile.mkdtemp() por sessão

shell:
  # Allowlist de binários (seção 7.5) — comando fora daqui nunca executa (UNSAFE_COMMAND).
  # D-shell-crossplatform-hardening (docs/PLAN.md): a Fase H exige que o modelo saiba usar o
  # CLI NATIVO do SO do usuário (PowerShell/cmd no Windows, bash/coreutils no Linux/Mac). Rodar
  # comandos nativos de verdade exige liberar os interpretadores (powershell/cmd/bash) e mais
  # coreutils. Isso ENFRAQUECE a garantia original da allowlist ("só um punhado de binários
  # nomeados seguros roda"): com um interpretador liberado, o que protege é a denylist
  # reforçada abaixo + `shell_interpreters`/checagem de bypass no código + o workspace efêmero +
  # rede desligada. Escolha explícita do usuário ("híbrido endurecido"), documentada e não
  # silenciosa — a denylist substring NÃO é um sandbox formal, é defesa-em-profundidade.
  allowlist_binaries:
    # toolchain de dev (fase 1 original)
    - python
    - python3
    - pip
    - go
    - pytest
    - ruff
    - gofmt
    - git
    # coreutils POSIX (Linux/Mac; no host Windows vêm do Git Bash e rodam de verdade)
    - ls
    - cat
    - grep
    - find
    - wc
    - sed
    - awk
    - head
    - tail
    - sort
    - uniq
    - diff
    - tr
    - cut
    - tee
    - echo
    - pwd
    - basename
    - dirname
    # binários nomeados nativos do Windows (somente leitura/inspeção)
    - findstr
    - where
    # interpretadores (necessários pra comandos embutidos do shell e pipelines reais) —
    # ver `shell_interpreters` e a checagem de bypass por comando codificado no código
    - powershell
    - pwsh
    - cmd
    - bash
    - sh
  # Interpretadores de shell — recebem escrutínio extra em src/security/policy.py (bloqueio de
  # bypass por comando codificado em base64, ex.: `powershell -EncodedCommand <b64>`, que
  # driblaria a denylist substring por não conter os verbos em texto claro).
  shell_interpreters:
    - powershell
    - pwsh
    - cmd
    - bash
    - sh
  # Subcomandos permitidos quando o binário é "git". D-git-write-ops (docs/PLAN.md): além da
  # inspeção somente-leitura original (status/diff/log/show), o dia-a-dia de escrita
  # (add/commit/branch/checkout/switch/stash/merge/tag/init) — como o Claude Code faz. As formas
  # DESTRUTIVAS ficam bloqueadas pela denylist abaixo (push, reset --hard, clean, checkout que
  # descarta mudanças, branch -D, stash clear/drop) — a escrita liberada é a do fluxo normal, não
  # a que perde trabalho. `commit` continua sendo ação que o modelo só faz quando o usuário pede.
  git_allowed_subcommands:
    - status
    - diff
    - log
    - show
    - add
    - commit
    - branch
    - checkout
    - switch
    - stash
    - merge
    - tag
    - init
    - rev-parse
  # Padrões sempre bloqueados, mesmo que o binário base esteja na allowlist. Casados por
  # substring contra `binary + args` em minúsculas (nunca uma string de shell executada —
  # ver D-shell-v2). Cobrem os verbos destrutivos/de rede/de execução dos três shells.
  denylist_patterns:
    # --- POSIX / Unix (bash/sh/coreutils) ---
    - "rm -rf"
    - "rm -r -f"
    - "rm -fr"
    - "rm -r "
    - "rm -f "
    - "sudo"
    - "curl"
    - "wget"
    # `dd if=`/`dd of=` (não só "dd ", que dava falso positivo em "git add ." — D-git-write-ops)
    - "dd if="
    - "dd of="
    - "mkfs"
    - "fdisk"
    - "shred "
    - "shutdown"
    - "reboot"
    - "chmod 777"
    - "chmod -r"
    - "chown "
    - "kill -9"
    - "pkill"
    - "killall"
    - ":(){"
    - ">/dev"
    - "> /dev"
    - "> /etc"
    - ">/etc"
    - "tee /etc"
    # --- git destrutivo/remoto (bloqueado mesmo com escrita liberada, D-git-write-ops) ---
    - "git push"
    - "git reset --hard"
    - "git reset --merge"
    - "git clean"
    - "checkout -- "
    - "checkout ."
    - "branch -d"
    - "branch --delete"
    - "stash clear"
    - "stash drop"
    - "tag -d"
    - "checkout -f"
    - "branch -f"
    - "git push --force"
    # --- PowerShell ---
    - "remove-item"
    - "remove-itemproperty"
    - "clear-content"
    - "set-content"
    - "add-content"
    - "out-file"
    - "invoke-expression"
    - "iex "
    - "invoke-webrequest"
    - "iwr "
    - "invoke-restmethod"
    - "irm "
    - "start-process"
    - "set-executionpolicy"
    - "downloadstring"
    - "downloadfile"
    - "net.webclient"
    - "stop-process"
    - "stop-computer"
    - "restart-computer"
    - "new-service"
    - "set-service"
    - "-encodedcommand"
    - "-enc "
    # --- cmd.exe ---
    - "del /"
    - "erase "
    - "rd /s"
    - "rmdir /s"
    - "format "
    - "diskpart"
    - "reg delete"
    - "reg add"
    - "reg import"
    - "net user"
    - "net localgroup"
    - "sc delete"
    - "sc config"
    - "takeown"
    - "icacls "
    - "cipher /w"
    - "bcdedit"
    - "vssadmin"
    - "wmic "
    - "schtasks "
    - "attrib "

network:
  shell_network_enabled: false
  package_install_enabled: false     # instalação dinâmica de pacotes desabilitada na fase 1 (seção 7.9)
  # Única exceção de rede do sistema: a ferramenta web_search, restrita ao host abaixo (seção 7.6).
  web_search_allowed_hosts:
    - "ollama.com"

confirmation:
  # Política padrão do harness de desenvolvimento (seção 7.7). A CLI futura troca isso
  # por um prompt real ao usuário humano.
  mode: "deny_all_destructive"   # "deny_all_destructive" | "auto_approve_safe"

secrets:
  # Allowlist de env vars propagadas ao subprocess do sandbox (allowlist, não denylist — seção 7.8).
  allowed_env_passthrough:
    - "PATH"
    - "HOME"
    - "GOPATH"
    - "GOCACHE"
    # D-crosslayer-dataset-fase-f (achado real, docs/PLAN.md): sem TEMP/TMP nem USERPROFILE
    # repassados, `go run`/`go build` no Windows falha com "mkdir C:\WINDOWS\go-build...:
    # Access is denied" — o Go resolve seu diretório de cache via os.UserCacheDir(), que no
    # Windows cai pra GetWindowsDirectory() (C:\Windows, sem permissão de escrita) quando
    # TEMP/TMP/USERPROFILE estão todos ausentes do ambiente do subprocess. Reproduzido de
    # verdade rodando `shell` com binary="go" antes de decidir a correção.
    - "TEMP"
    - "TMP"
    - "USERPROFILE"
    - "LOCALAPPDATA"
  redaction_patterns:
    - "sk-[A-Za-z0-9]{20,}"
    - "gh[pousr]_[A-Za-z0-9]{20,}"
    - "eyJ[A-Za-z0-9_-]{10,}\\.[A-Za-z0-9_-]{10,}\\.[A-Za-z0-9_-]{10,}"   # JWT-like
    - "[A-Za-z0-9]{32}\\.[A-Za-z0-9_-]{20,}"                              # chaves estilo Ollama
