# Backend de busca (seção 5.4 do PLAN.md) — trocar "provider" é a única mudança necessária
# para migrar de motor de busca; nenhum código chamador conhece qual provider está ativo.

search_backend:
  provider: "ollama"   # "ollama" | "mock"

  ollama:
    endpoint: "https://ollama.com/api/web_search"
    api_key_env: "PRAXIS_OLLAMA_SEARCH_API_KEY"   # valor real só na env do ambiente/Colab secret
    timeout_ms: 8000
    max_results: 5

  mock:
    fixtures_path: "data/fixtures/web_search/"
