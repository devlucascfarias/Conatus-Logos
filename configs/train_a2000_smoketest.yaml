# Config de TESTE de VRAM pra RTX A2000 12GB (não é config de treino completo — sequence_length
# reduzido pra caber na estimativa da seção 11.3 do PLAN.md, que projeta ~12-17 GB numa L4 de
# 24GB com seq_len=4096; numa placa de 12GB isso fica na borda ou estoura, então reduzimos aqui
# antes de medir de verdade com scripts/vram_smoketest.py). Copiado de train_l4.yaml com dois
# valores trocados: sequence_length e require_gpu_name_contains.
#
# sequence_length=2048 ainda estourou no teste real (--longest --num-examples 1): pico de
# ~9.95 GiB só pra ESSA parte, mais ~1.37 GiB que o nvidia-smi confirmou serem do ambiente
# gráfico do desktop (Xorg/GNOME Shell/VS Code/navegador) rodando na MESMA GPU — essa não é
# uma GPU dedicada de treino, headless. Reduzido pra 1536: afeta só os ~10 exemplos
# desproporcionalmente grandes (gen-hyprevision-*, 13-15KB) de ~2455 em data/train, perda de
# sinal de treino desprezível.

version: 1

model:
  base_model: "ibm-granite/granite-4.1-8b"
  load_in_4bit: true
  bnb_4bit_quant_type: "nf4"
  bnb_4bit_compute_dtype: "bfloat16"
  bnb_4bit_use_double_quant: true

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"

data:
  train_path: "data/train"
  validation_path: "data/validation"
  sequence_length: 1536
  group_by_length: true

training:
  batch_size_per_device: 1
  gradient_accumulation_steps: 16
  learning_rate: 2.0e-4
  lr_scheduler_type: "cosine"
  warmup_ratio: 0.03
  num_train_epochs: 3
  max_steps: -1
  optim: "paged_adamw_8bit"
  gradient_checkpointing: true
  seed: 42

evaluation:
  # Mesma recalibração de train_l4.yaml — data/train tem 2455 exemplos hoje, não os ~465
  # assumidos no valor antigo (eval_steps=15). ~76 passos = meia época com lote efetivo 16.
  eval_steps: 76
  save_steps: 76
  save_total_limit: 3

paths:
  output_dir: "outputs/checkpoints"
  logs_dir: "outputs/logs"
  adapter_dir: "outputs/adapter"
  drive_mount_point: "/content/drive"

runtime:
  run_on_colab: false
  require_gpu_name_contains: "A2000"
  mixed_precision: "bf16"
